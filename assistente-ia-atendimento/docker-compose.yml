# Removida a linha version, pois agora é obsoleta e gera avisos no log.

# ──────────────────────────────────────────────────────────────────────────────
# Assistente IA para Atendimento — Docker Compose Atualizado
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # REMOVIDO: target: runtime (causava o erro de build)
    container_name: atendimento_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Assistente IA para Atendimento"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      SHOW_DOCS: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-atendimento}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-verify_token_aqui}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console} # Alterado para console em dev para facilitar leitura
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atendimento_network
    healthcheck:
      # Simplificado o teste de healthcheck para garantir que não trave o container
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Migrations ─────────────────────────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atendimento_migrate
    # O comando abaixo garante que as tabelas sejam criadas antes da API estabilizar
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-atendimento}
      SECRET_KEY: ${SECRET_KEY:-dev_key_32_chars_minimum_required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev_internal_key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atendimento_network
    restart: "no"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: atendimento_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atendimento_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-atendimento}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atendimento_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - atendimento_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── n8n ──────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: atendimento_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-atendimento}
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atendimento_network

# ──────────────────────────────────────────────────────────────────────────────
# Volumes e Networks permanecem iguais
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  atendimento_network:
    driver: bridge
    name: atendimento_network